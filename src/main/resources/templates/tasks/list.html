<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>タスク一覧</title>
</head>
<body>
<section layout:fragment="content">
    <div>
        <a th:href="@{/tasks/creationForm}" class="btn btn-primary">作成</a>
    </div>
    <div class="card">
        <div class="card-header">
            検索
        </div>
        <div class="card-body">
            <form th:action="@{/tasks}" method="get">
                <div class="form-group mt-3">
                    <label class="form-label" for="summaySerch">概要</label>
                    <input class="form-control" id="summaySerch" name="summary" placeholder="概要で検索">
                </div>
                <div class="form-group mt-3">
                    <div>
                        <label class="form-label">ステータス</label>
                    </div>
                <div >
                    <input type="checkbox" id="statusSerchTodo" name="status" value="TODO">
                    <label for="statusSerchTodo">TODO</label>
                    <input type="checkbox" id="statusSerchDoing" name="status" value="DOING">
                    <label for="statusSerchDoing">DOING</label>
                    <input type="checkbox" id="statusSerchDone" name="status" value="DONE">
                    <label for="statusSerchDone">DONE</label>
                </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">検索</button>
            </form>
        </div>
    </div>
    <div>
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>概要</th>
                <th>詳細</th>
                <th>状態</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task :${taskList}" th:object="${task}">
                <td ><a th:href="@{/tasks/{id}(id=*{id})}" th:text =" '#' + *{id}"></a></td>
                <td><a th:href="@{/tasks/{id}(id=*{id})}" th:text = "*{summary}"></a></td>
                <td th:text="*{summary}"></td>
                <td th:text="*{description}"></td>
                <td th:text="*{status}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</section>>

</body>
</html>
